<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Atlas files">Pliki atlasu</title>
  <link rel="stylesheet" href="/mapa.css">
  <script src="/jezyk.js" defer></script>
  <script src="/pliki.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">✧</span>
        <div><h1 data-en="Atlas files">Pliki atlasu</h1><p data-en="Live preview of the files saved on this device">Podgląd bieżących danych zapisanych na urządzeniu</p></div>
      </div>
      <a class="download" href="/" data-en="Open the map">Otwórz mapę</a>
    </div>
  </header>
  <main class="shell csv-workspace">
    <section class="card csv-preview" aria-labelledby="settings-title">
      <h2 id="settings-title">ustawienia.csv</h2>
      <pre id="settings-csv" tabindex="0">Wczytywanie…</pre>
    </section>
    <section class="card csv-preview" aria-labelledby="visits-title">
      <h2 id="visits-title">odwiedzone.csv</h2>
      <pre id="visits-csv" tabindex="0">Wczytywanie…</pre>
    </section>
    <section class="card csv-preview" aria-labelledby="achievement-file-title">
      <h2 id="achievement-file-title">osiagniecia.csv</h2>
      <pre id="achievements-csv" tabindex="0">Wczytywanie…</pre>
    </section>
  </main>
</body>
</html>
